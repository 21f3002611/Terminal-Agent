[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "terminal-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "python-dotenv",
    "tavily-python",
    "click",
]

[project.scripts]
agent = "agent.cli:cli"
